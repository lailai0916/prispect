name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
      - uses: actions/checkout@v7
        with:
          repository: lailai0916/lailai-template
          ref: aab624269fb9cdf18b9da5d11605eb9b0fc79154
          path: standards
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate repository standards
        run: python3 standards/scripts/check_repository.py --root project --slug lailai0916/prispect --display-name 'Prispect'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci
        working-directory: project
      - run: npm run check
        working-directory: project
